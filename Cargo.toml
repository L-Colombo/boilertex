[package]
name = "boilertex"
version = "0.1.0"
edition = "2024"

[dependencies]
bat = { version = "0.26.1", default-features = false, features = ["regex-fancy"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_allgen = "0.2.1"
colored = "3.1.1"
serde = "1.0.228"
serde_derive = "1.0.228"
toml = "1.1.2"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
codegen-units = 1
lto = true
