[package]
name = "boilertex"
version = "0.1.0"
edition = "2024"

[dependencies]
bat = { version = "0.25.0", default-features = false, features = ["regex-fancy"] }
clap = { version = "4.5.41", features = ["derive"] }
clap_allgen = "0.2.1"
colored = "3.0.0"
serde = "1.0.219"
serde_derive = "1.0.219"
toml = "0.9.2"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
codegen-units = 1
lto = true
